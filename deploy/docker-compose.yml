# Polynexus HMS — on-premise stack (Linux or Windows host with Docker).
# Set up with install.sh (Linux) or install.ps1 (Windows); see RUNBOOK.md.
name: hms

x-app: &app
  image: ${REGISTRY:-polynexus}/hms-backend:${HMS_VERSION:?HMS_VERSION is not set in .env}
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-hms}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-hms}
    CACHE_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    # The machine fingerprint reads the host's identity files mounted below.
    LICENSE_HOST_ROOT: /host
  volumes:
    - ./config:/app/config                # license.lic lives here (drop-in or upload)
    - media:/app/media
    - ${HOST_MACHINE_ID:-/etc/machine-id}:/host/etc/machine-id:ro
    - ${HOST_PRODUCT_UUID:-/sys/class/dmi/id/product_uuid}:/host/sys/class/dmi/id/product_uuid:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    # Runs migrations on start (RUN_MIGRATIONS defaults to 1); healthcheck is built into the image.

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  nginx:
    image: ${REGISTRY:-polynexus}/hms-frontend:${HMS_VERSION:?}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # How often nginx checks certs/ for a new or renewed certificate.
      CERT_CHECK_SECONDS: ${CERT_CHECK_SECONDS:-3600}
    volumes:
      - ./certs:/etc/nginx/certs:ro       # tls.crt + tls.key here turns HTTPS on
      - acme:/var/www/acme:ro             # Let's Encrypt domain checks (configure-domain)
    depends_on:
      web:
        condition: service_healthy
    # healthcheck is built into the image (GET /healthz)

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hms}
      POSTGRES_USER: ${POSTGRES_USER:-hms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Nightly database + uploaded-files backup (see backup.sh). Point BACKUP_DIR
  # in .env at a NAS or external drive so backups survive a disk failure.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hms}
      POSTGRES_USER: ${POSTGRES_USER:-hms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${BACKUP_TZ:-IST-5:30}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - media:/hms-media:ro
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Let's Encrypt certificate renewal. Only runs once configure-domain has set
  # it up (COMPOSE_PROFILES=letsencrypt in .env); needs the server reachable
  # from the internet on port 80. Renewed certificates are copied to certs/,
  # where nginx picks them up without a restart.
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    profiles: ["letsencrypt"]
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - >-
        trap exit TERM;
        while :; do
        certbot renew --webroot -w /var/www/acme --deploy-hook
        'cp $$RENEWED_LINEAGE/fullchain.pem /certs/tls.crt && cp $$RENEWED_LINEAGE/privkey.pem /certs/tls.key';
        sleep 12h & wait $$!;
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/acme
      - ./certs:/certs

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  redisdata:
  media:
  acme:
  letsencrypt:
