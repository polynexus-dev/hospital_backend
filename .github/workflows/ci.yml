name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polynexus
          POSTGRES_PASSWORD: polynexus
          POSTGRES_DB: hospital_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      DEBUG: "True"
      DATABASE_URL: postgres://polynexus:polynexus@localhost:5432/hospital_crm
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      CACHE_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest -q --cov --cov-report=term --cov-report=xml 2>&1 | tee pytest-output.log

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml

      - name: Dependency vulnerability scan (pip-audit)
        # Blocking (see docs/SECURITY_COMPLIANCE.md finding M4, closed
        # 2026-09-22): a newly-disclosed CVE in a pinned dependency should
        # stop a merge, not just leave a note in the run summary nobody
        # reads until it's already deployed. If a specific advisory is a
        # known false positive or genuinely unfixable right now, suppress
        # it explicitly with `--ignore-vuln <id>` (and a comment saying
        # why) rather than reaching for continue-on-error again.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Email test report
        # Fires on pass or fail (if: always()) with the full pytest output
        # attached — GitHub's own native run-status email (account
        # Settings > Notifications > Actions) covers the bare pass/fail
        # signal already; this covers the "what actually happened" report.
        # Non-blocking: a report failing to send (bad creds, mail server
        # hiccup) must never fail CI or block a merge on its own.
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.polynexus.in
          server_port: 587
          username: reports@polynexus.in
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Polynexus CI <reports@polynexus.in>
          to: aniket@polynexus.in
          subject: "Backend CI ${{ job.status }}: ${{ github.repository }} #${{ github.run_number }}"
          body: |
            Backend CI run ${{ job.status }} for ${{ github.repository }} on branch ${{ github.ref_name }} (${{ github.sha }}).

            Full pytest output is attached.

            Triggered by: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: pytest-output.log

  django-check:
    runs-on: ubuntu-latest
    # DJANGO_SETTINGS_MODULE=config.settings.prod, not the manage.py default
    # (config.settings.dev) — see docs/SECURITY_COMPLIANCE.md finding M4,
    # closed 2026-09-22. `check --deploy` against dev.py mostly checked
    # settings dev.py deliberately leaves relaxed (DEBUG=True, no HSTS, no
    # secure cookies) and was flagged continue-on-error for exactly that
    # reason — it wasn't testing anything meaningful. Against prod.py it
    # actually exercises the fail-closed placeholder guards (SECRET_KEY,
    # FIELD_ENCRYPTION_KEY(S), FIELD_ENCRYPTION_KEY_V2(S), FIELD_HASH_KEY —
    # see config/settings/prod.py) plus the real HSTS/cookie/SSL-redirect
    # hardening, which is the whole point of running this job.
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # 50+ chars, high-entropy — django.core.management.utils.get_random_secret_key()
      # output, not a real deployment secret. Needs to be genuinely strong,
      # not just "non-placeholder": security.W009 (part of the `security`
      # tag this job now fails on) flags short/low-entropy SECRET_KEYs too,
      # and the previous CI-only value ("ci-test-secret-key-not-for-..."),
      # while passing prod.py's placeholder guard, tripped that check.
      SECRET_KEY: "-*kh7_(=_4aq0*f)1h65wncn$r%9$je&djl1j4fp^=^8ykc33o"
      DATABASE_URL: postgres://polynexus:polynexus@localhost:5432/hospital_crm
      ALLOWED_HOSTS: hms.polynexus.in
      # CI-only values in valid Fernet/AES-256-GCM key format — not real
      # secrets, just non-placeholder enough to pass prod.py's guards and
      # let the encryption module actually initialize during the check.
      # Never used against real data; regenerate freely if ever rotated.
      FIELD_ENCRYPTION_KEY: QaTZ1SVvHlAxYApyGGsKYHgDP0gHz9jY6tcLMrd7iA4=
      FIELD_ENCRYPTION_KEY_V2: d7Ka8csLrq4GSCfK1xrP_uGbg3x6tTinX-K6jqT6vEw=
      FIELD_HASH_KEY: O31bU4pjbzkB3djMs3VjDqFxFLHgvt6Ajk-irCG7egQ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django system checks (production settings, security-tagged only)
        # --tag security --fail-level WARNING: scopes this to Django's own
        # deploy-security checklist (security.W004/W008/W009/W018/... —
        # HSTS, SECRET_KEY strength, cookie flags, etc.) and fails on any
        # warning there, not just errors. Deliberately NOT plain
        # `--deploy` with no filter: that also runs drf_spectacular's
        # schema-generation checks, which surface ~45 pre-existing,
        # security-unrelated warnings (unresolved type hints, enum-naming
        # collisions) on this codebase today — failing the build on those
        # too would just teach people to ignore or bypass this gate again,
        # the same failure mode that let C1/H1/H8 regress unnoticed.
        run: python manage.py check --deploy --tag security --fail-level WARNING
