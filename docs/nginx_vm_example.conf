# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR MULTI-TENANT DOMAINS (*.hms.polynexus.in)
# Place in: /etc/nginx/sites-available/hms.polynexus.in
# Enable with: ln -s /etc/nginx/sites-available/hms.polynexus.in /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Product Landing Page: hms.polynexus.in
server {
    listen 80;
    server_name hms.polynexus.in;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Central Admin Console: admin.hms.polynexus.in
server {
    listen 80;
    server_name admin.hms.polynexus.in;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Main Application & Tenant Subdomains: app.hms.polynexus.in, *.hms.polynexus.in
server {
    listen 80;
    server_name app.hms.polynexus.in *.hms.polynexus.in;

    # API Proxy -> Backend Container on Port 8001
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin fallback on API subdomains if needed
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8001/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Frontend Proxy -> Frontend Container on Port 8002
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
